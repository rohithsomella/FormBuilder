<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form Preview</title>
    <link id="themeStylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/formio.full.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/Formio_Template.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: white;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .preview-container {
            max-width: 1600px;
            width: 90%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }
        .preview-header h2 {
            margin: 0;
            color: #333;
        }
        #previewFormContent {
            min-height: 400px;
        }
        .error-message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>

    <!-- Page guard: requires a signed-in session before this page renders. -->
    <script src="../js/auth.js"></script>
</head>
<body>

<div class="preview-container">
    <div class="preview-header">
        <h2 id="previewTitle">Form Preview</h2>
        <button id="closeViewerBtn" class="btn btn-sm btn-secondary" style="display: none;" onclick="window.close()">Close</button>
    </div>
    <div id="previewFormContent">
        <div class="loading">
            <i class="bi bi-hourglass-split"></i> Loading form...
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/formio.full.js"></script>
<script src="../js/FormBuilderApi.js"></script>
<script src="../js/formComponentSource.js"></script>
<script src="../js/formSubmissionHandler.js"></script>
<script src="../js/preview.js"></script>

</body>
</html>
