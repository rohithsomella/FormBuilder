<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Open Existing Tenants</title>
    <link id="themeStylesheet" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../css/existingForms.css">
    <link rel="stylesheet" href="../css/builder.css">

    <!-- Page guard: requires a signed-in session before this page renders. -->
    <script src="../js/auth.js"></script>
</head>

<body>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="builder-navbar">
        <div class="header-left">
            <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" data-toggle="tooltip" data-placement="bottom"
                title="Menu">
                <i class="bi bi-list"></i>
            </button>
            <h2>Tenants</h2>
        </div>
    </div>

    <div id="tenantsList" class="forms-list-container">
        <div class="forms-wrapper">
            <div id="tenantsLoadingMessage" class="alert alert-info">
                <i class="bi bi-info-circle"></i> <strong>Loading tenants...</strong>
            </div>

            <div class="table-controls" id="tenantsTableControls" style="display: none;">
                <div class="controls-left">
                    <input type="text" id="tenantsSearchInput" class="search-box" placeholder="Search tenants..." />
                    <select id="tenantsFilterSelect" class="filter-dropdown">
                        <option value="">Sort by:</option>
                        <option value="name-asc">A - Z</option>
                        <option value="name-desc">Z - A</option>
                        <option value="date-desc">New - Old</option>
                        <option value="date-asc">Old - New</option>
                    </select>
                </div>
                <div class="controls-right">
                    <button class="btn btn-primary" onclick="TenantHandler.addTenant()">
                        <i class="bi bi-plus-lg"></i> Add New Tenant
                    </button>
</div>
            </div>

            <table id="tenantsTable" class="table table-striped table-hover" style="display: none;">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 70%;">Tenant Name</th>
                        <th style="width: 20%; text-align: center; padding-left: 200px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tenantsTableBody"></tbody>
            </table>

            <div class="pagination-controls" id="tenantsPaginationControls" style="display: none;">
                <div class="pagination-buttons">
                    <button class="pagination-btn" id="tenantsPrevPageBtn" onclick="TenantHandler.previousTenantPage()">
                        &lt; Previous
                    </button>

                    <div class="page-numbers" id="tenantsPageNumbers"></div>

                    <button class="pagination-btn" id="tenantsNextPageBtn" onclick="TenantHandler.nextTenantPage()"
                        style="display: none;">
                        More &gt;
                    </button>
                </div>
                <div class="pagination-info">
                    <span id="tenantsPaginationInfo">Page 1</span>
                </div>
            </div>
        </div>
        
        <!-- Unified Tenant Modal -->
<div class="modal fade" id="tenantModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalTitle">Add New Tenant</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <!-- Hidden input stores Tenant ID for Update mode; empty for Add mode -->
                <input type="hidden" id="tenantId">

                <div class="form-group">
                    <label for="tenantName">Tenant Name</label>
                    <input type="text" id="tenantName" class="form-control" placeholder="Enter Tenant Name">
                </div>

                <div id="tenantMessage" class="alert" style="display:none; margin-top:10px;"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" id="btnSaveTenant" class="btn btn-primary" onclick="TenantHandler.saveOrUpdateTenant()">
                    Save
                </button>
            </div>

        </div>
    </div>
</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/formio.full.js"></script>
    <script src="../js/CommonItems.js"></script>
    <script src="../js/IdGenerators.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/FormBuilderApi.js"></script>
    <script src="../js/tenantHandler.js"></script>

</body>

</html>
