<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/builder.css">
    <link rel="stylesheet" href="../css/userProfile.css">

    <!-- In <head> so the guard settles before anything paints. -->
    <script src="../js/auth.js"></script>

    <style>
        .role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: linear-gradient(135deg, #5f5de8, #8b67ff); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
        .admin-api-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px; font-size: 12px; color: #777; }
        .admin-api-status { padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 11px; }
        .admin-api-status.checking { background: #eef0f4; color: #667; }
        .admin-api-status.ok { background: #e6f6ec; color: #1d7a41; }
        .admin-api-status.failed { background: #fdecea; color: #a4322a; }
    </style>
</head>

<!--
    data-profile-role tells userProfile.js which role this page belongs to. A non-admin
    who reaches this URL is redirected straight to userProfile.html, so admin content is
    never rendered for a normal user and never lingers after switching accounts.

    Note this redirect is convenience, not protection: the Admin-only API below is what
    actually enforces the role.
-->
<body data-profile-role="Admin">

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Navigation Header -->
    <div class="profile-nav">
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" data-toggle="tooltip" data-placement="bottom" title="Menu">
            <i class="bi bi-list"></i>
        </button>
        <h2>Admin Profile</h2>
    </div>

    <!-- Main Centered Layout Wrapper -->
    <div class="profile-page-container">
        <div class="wireframe-card">

            <!--
                Confirmation that a save landed. Lives on the page, not in the dialog,
                because the dialog closes the moment a save succeeds.

                Inside the card on purpose: .profile-page-container is a flex ROW, so a
                banner placed there is laid out beside the card instead of above the
                content. The card is an ordinary block, so it stacks correctly and
                inherits the width the fields already use.

                role="status" rather than "alert": this is good news the user asked for,
                so it waits for a natural pause instead of interrupting. Errors keep the
                assertive role="alert" inside the dialog.
            -->
            <div class="page-notice" id="profilePageNotice" role="status" aria-live="polite"
                 style="display: none;"></div>

            <!-- Top Row: Circle Avatar + Name + Role -->
            <div class="header-wireframe-layout">
                <div class="profile-pic-circle" id="profileAvatar">--</div>

                <div class="header-fields-stack">
                    <!-- Full Name Box -->
                    <div class="info-box">
                        <span class="box-label">Full Name</span>
                        <span class="box-value" id="fieldName">-</span>
                    </div>

                    <!-- Role Box -->
                    <div class="info-box info-box-sm">
                        <span class="box-label">Role</span>
                        <span class="box-value">
                            <span class="role-badge"><i class="bi bi-shield-lock-fill"></i>
                                <span id="fieldRole">-</span>
                            </span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Email + Other Important Fields -->
            <div class="bottom-fields-grid">
                <!-- Email Box -->
                <div class="info-box">
                    <span class="box-label">Email</span>
                    <span class="box-value" id="fieldEmail">-</span>
                </div>

                <!-- Username -->
                <div class="info-box">
                    <span class="box-label">Username</span>
                    <span class="box-value" id="fieldUserName">-</span>
                </div>

            </div>

            <!-- Action Buttons -->
            <div class="card-actions-row">
                <button class="btn-action btn-edit" id="btnEditProfile">
                    <i class="bi bi-pencil"></i> Edit Profile
                </button>
                <button class="btn-action btn-edit" id="btnAdminSettings">
                    <i class="bi bi-gear"></i> Admin Settings
                </button>
                <button class="btn-action btn-signout" id="btnSignOut">
                    <i class="bi bi-box-arrow-right"></i> Sign Out
                </button>
            </div>

            <!--
                Live confirmation that the Admin role is real. This calls an endpoint
                marked [Authorize(Roles = "Admin")]; a browser pretending to be an admin
                gets 403 here and the badge says so.
            -->
            <div class="admin-api-row">
                <i class="bi bi-shield-check"></i>
                <span>Admin API access:</span>
                <span class="admin-api-status checking" id="adminApiStatus">Checking...</span>
            </div>

        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editProfileOverlay"></div>
    <div class="edit-profile-modal" id="editProfileModal">
        <div class="modal-header">
            <h3 id="editModalTitle">-</h3>
        </div>

        <form id="editProfileForm">
            <!--
                Whatever the API refused, in one place at the top of the dialog. The
                previous version reported everything through alert(), which cannot show
                more than one problem and disappears before the user can act on it.

                role="alert" is assertive on purpose: this appears in response to the user
                pressing Save, and it is the reason the thing they asked for did not
                happen, so it is worth interrupting for. showEditProfileError() reveals
                the banner before writing into it - see the note there.
            -->
            <div class="modal-error" id="editProfileError" role="alert" style="display: none;"></div>

            <div class="form-row">
                <div class="form-group">
                    <label>FIRST NAME</label>
                    <div class="input-with-icon">
                        <input type="text" id="editFirstName" placeholder="Enter first name" />
                        <button type="button" class="icon-btn edit-icon" id="toggleEditFirstName" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>LAST NAME</label>
                    <div class="input-with-icon">
                        <input type="text" id="editLastName" placeholder="Enter last name" />
                        <button type="button" class="icon-btn edit-icon" id="toggleEditLastName" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-row-with-button">
                <div class="form-group">
                    <label>USERNAME</label>
                    <div class="input-with-icon">
                        <input type="text" id="editUserName" placeholder="Enter username" />
                        <button type="button" class="icon-btn verify-btn" id="verifyUsername" title="Verify" disabled>
                            Verify
                        </button>
                        <button type="button" class="icon-btn edit-icon" id="toggleEditUserName" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                    <!--
                        The Verify button's verdict. Cleared whenever the box is edited.

                        Polite rather than assertive: the answer is worth hearing but the
                        user may still be typing, and it never blocks anything. aria-atomic
                        makes it read as one sentence instead of only the words that
                        changed. The node is always in the tree and only its text changes,
                        so this needs no help from the script.
                    -->
                    <div class="username-feedback" id="editProfileUserNameFeedback"
                         aria-live="polite" aria-atomic="true"></div>
                </div>
                <!--
                    No "Deactive Account" button here, unlike userProfile.html. The API
                    refuses to deactivate an Admin account at all - an admin who suspends
                    themselves may be the only one able to undo it - so offering the button
                    only bought a scare-confirm followed by a 400. routeToCorrectProfile()
                    guarantees an admin lands on this page, so removing it here removes it
                    for exactly the people it never worked for.

                    The refusal in AuthService.DeactivateOwnAccountAsync is what enforces
                    this. Deleting a button is not a control.
                -->
                <div class="form-row-with-button-actions">
                    <button type="button" class="btn-change-password" id="btnChangePassword">
                        Change Password
                    </button>
                </div>
            </div>

            <!-- Password Fields Section -->
            <div class="password-section" id="passwordSection" style="display: none;">
                <div class="password-divider">
                    <span>Change Password</span>
                </div>
                
                <!--
                    All three boxes are type="password" - masked by default - and all
                    three carry the eye button that reveals them. It is always present, on
                    every box: a password you cannot read back is one you cannot check
                    before committing to it, and that applies as much to the current
                    password (worth re-reading before blaming the server for refusing it)
                    as to the two new ones that have to match each other.
                -->
                <div class="form-group">
                    <label>CURRENT PASSWORD</label>
                    <div class="password-input-wrap">
                        <input type="password" id="currentPassword" placeholder="Enter current password"
                               autocomplete="current-password" spellcheck="false" />
                        <button type="button" class="btn-password-reveal" data-reveals="currentPassword"
                                title="Show password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>NEW PASSWORD</label>
                    <div class="password-input-wrap">
                        <input type="password" id="newPassword" placeholder="Enter new password"
                               autocomplete="new-password" spellcheck="false" />
                        <button type="button" class="btn-password-reveal" data-reveals="newPassword"
                                title="Show password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>CONFIRM PASSWORD</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmPassword" placeholder="Confirm new password"
                               autocomplete="new-password" spellcheck="false" />
                        <button type="button" class="btn-password-reveal" data-reveals="confirmPassword"
                                title="Show password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancelEditProfile">Cancel</button>
                <button type="submit" class="btn-save">Save</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/CommonItems.js"></script>
    <!--
        Every request this page makes goes through FormBuilderApi, the same as every other
        page. It must load before userProfile.js, which calls into it, and it also gives
        auth.js the API host to derive its own /auth URLs from - so the hardcoded fallback
        in both files stops being what this page actually runs on.
    -->
    <script src="../js/FormBuilderApi.js"></script>
    <script src="../js/userProfile.js"></script>
</body>

</html>
