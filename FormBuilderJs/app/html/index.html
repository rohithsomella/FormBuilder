<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Builder Test</title>
	<!-- <link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"> -->
<link id="themeStylesheet"
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
	<link rel="stylesheet" href="../../dist/formio.full.css">
        <!-- <link rel='stylesheet' href='https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css'> -->


    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../css/builder.css">

    <!-- Quill Editor -->
    <!-- <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet"> -->



    <!-- Page guard: requires a signed-in session before this page renders. -->
    <script src="../js/auth.js"></script>

    <!--
      Loading overlay: markup is at the top of <body>, styles are in ../styles.css,
      and the gate logic that decides when to lift it is in AppLoader, at the top of
      ../js/main.js.
    -->
</head>
<body>

<div id="appLoader">
    <div class="app-loader__spinner">
        <div class="app-loader__ring"></div>
        <div class="app-loader__ring app-loader__ring--inner"></div>
    </div>
    <div class="app-loader__title">FORM BUILDER</div>
    <div class="app-loader__status" id="appLoaderStatus">Loading assets&hellip;</div>
    <div class="app-loader__track">
        <div class="app-loader__bar" id="appLoaderBar"></div>
    </div>
</div>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="builder-navbar">
    <div class="header-left">
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" data-toggle="tooltip" data-placement="bottom" title="Menu">
            <i class="bi bi-list"></i>
        </button>
        <h2>Form Builder</h2>
    </div>

    <div class="form-name-wrapper">
    <input
        type="text"
        class="form-name-input"
        value="Untitled Form"
        disabled>

        <button class="edit-form-btn" title="Edit Name" data-toggle="tooltip" data-placement="bottom">
            <i class="bi bi-pencil"></i>
        </button>
    </div>

<div class="menu-buttons">

    <button class="btn btn-light" id="newEdit" title="New" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-file-earmark-plus"></i>
    </button>

    <button class="btn btn-light" id="openJson"
            title="Open JSON"
            data-toggle="tooltip" data-placement="bottom"
            onclick="document.getElementById('jsonFile').click()">
        <i class="bi bi-folder2-open"></i>
    </button>

    <button class="btn btn-light" id="downloadJson" title="Download" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-download"></i>
    </button>

    <button class="btn btn-light" id="undoBtn" title="Undo" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-arrow-counterclockwise"></i>
    </button>

    <button class="btn btn-light" id="redoBtn" title="Redo" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-arrow-clockwise"></i>
    </button>

    <button hidden class="btn btn-light" title="Settings" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-gear"></i>
    </button>

</div>

<div class="top-actions">

    <label class="theme-switch">
    <input type="checkbox" id="themeToggle">
    <span class="slider"></span>
</label>

    <!-- <button class="btn btn-success" id="previewForm" title="Preview" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-eye"></i>
    </button> -->

    <button  class="btn btn-success" id="previewFormPage" title="Launch" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-arrow-up-right-square"></i> 
    </button>

    <button class="btn btn-primary" id='saveBtn' title="Save" data-toggle="tooltip" data-placement="bottom">
        <i class="bi bi-floppy"></i>
    </button>

</div>

</div>


<input
type="file"
id="jsonFile"
accept=".json">

<div id="builder"></div>

<!-- Drag and Drop Alert -->
<div class="drag-and-drop-alert alert alert-info no-drag" style="display: none; margin: 20px; padding: 20px; border-radius: 8px; background: #e7f3ff; border: 1px solid #b3d9ff; color: #004085;">
    <i class="bi bi-info-circle"></i> <strong>Drop components here</strong> - Drag form elements from the left sidebar to build your form.
</div>


<!-- Form Details Modal -->
<div class="modal fade" id="formDetailsModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Form Details</h5>

                <button type="button"
                        class="close"
                        data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">

                <!-- Form Title -->
                <div class="form-group">
                    <label>Form Title</label>
                    <input type="text"
                           class="form-control"
                           id="formTitleInput">
                </div>

                <!-- Form Name -->
                <div class="form-group">
                    <label>Form Name</label>
                    <input type="text"
                           class="form-control"
                           id="formNameInput"
                           readonly>
                </div>

                <!-- Tags and Version Row -->
                <div class="row">
                    <!-- Tags Column (Left) -->
                    <div class="col-md-8">
                        <div class="form-group">
                            <label>Form Tags</label>

                            <div id="tagContainer" class="tag-container"></div>

                            <input type="text"
                                   class="form-control mt-2"
                                   id="tagInput"
                                   placeholder="Type tag and press Space">
                        </div>
                    </div>

                    <!-- Version Column (Right) -->
                    <div class="col-md-4">
                        <div class="form-group">
                            <label>Version</label>
                            <input type="text"
                                   class="form-control"
                                   id="formVersionInput"
                                   value="0"
                                   inputmode="numeric"
                                   maxlength="2"
                                   placeholder="0">
                        </div>
                    </div>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary"
                        data-dismiss="modal">
                    Close
                </button>

                <button class="btn btn-primary"
                        id="saveFormDetails">
                    Save
                </button>
            </div>

        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/formio.full.js"></script>
<script src="../js/CommonItems.js"></script>
<script src="../js/FormBuilderApi.js"></script>
<script src="../js/formSubmissionHandler.js"></script>
<script src="../js/IdGenerators.js"></script>
<script src="../js/main.js"></script>
<script src="../js/formComponentSource.js"></script>

</body></html>
